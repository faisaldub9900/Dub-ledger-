name: Build DUB LEDGER 12.1 ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            unzip xorriso squashfs-tools \
            debootstrap live-build \
            grub-pc-bin grub-efi-amd64-bin \
            mtools dosfstools isolinux \
            syslinux-common rsync wget curl git

      - name: Extract DUB LEDGER Build Kit
        run: |
          set -eux
          mkdir -p buildkit
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          test -n "$ZIP"
          unzip -q "$ZIP" -d buildkit
          SCRIPT=$(find buildkit -name BUILD-LINUX.sh | head -n 1)
          test -n "$SCRIPT"
          BUILD_DIR=$(dirname "$SCRIPT")
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          echo "Build script: $SCRIPT"
          find "$BUILD_DIR" -maxdepth 2 -type f | sort | head -200

      - name: Add Wi-Fi, LAN, firmware and desktop network manager packages
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$BUILD_DIR/config/package-lists"
          cat > "$BUILD_DIR/config/package-lists/dub-ledger-network.list.chroot" <<'PACKAGES'
          network-manager
          network-manager-gnome
          wpasupplicant
          wireless-tools
          iw
          rfkill
          modemmanager
          ppp
          usb-modeswitch
          bluez
          blueman
          firmware-linux
          firmware-linux-nonfree
          firmware-misc-nonfree
          firmware-iwlwifi
          firmware-realtek
          firmware-atheros
          firmware-brcm80211
          firmware-mediatek
          PACKAGES
          echo "Added common Wi-Fi/LAN, hotspot/modem and firmware packages."
          echo "Actual adapter support still depends on the computer's hardware and firmware availability."

      - name: Add Edge and app launchers
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$BUILD_DIR/config/hooks/live"
          mkdir -p "$BUILD_DIR/config/includes.chroot/usr/share/applications"
          mkdir -p "$BUILD_DIR/config/package-lists"
          cat > "$BUILD_DIR/config/package-lists/dub-ledger-desktop-apps.list.chroot" <<'PACKAGES'
          curl
          wget
          ca-certificates
          desktop-file-utils
          xdg-utils
          network-manager-gnome
          PACKAGES
          cat > "$BUILD_DIR/config/hooks/live/0100-install-edge-and-app-launchers.hook.chroot" <<'HOOK'
          #!/bin/sh
          set -eu
          apt-get update
          tmp_deb="$(mktemp /tmp/microsoft-edge-XXXXXX.deb)"
          if wget -q -O "$tmp_deb" "https://packages.microsoft.com/repos/edge/pool/main/m/microsoft-edge-stable/microsoft-edge-stable_amd64.deb"; then
            apt-get install -y "$tmp_deb" || apt-get -f install -y
          else
            echo "Microsoft Edge package download failed; browser web shortcuts will still be installed."
          fi
          rm -f "$tmp_deb"
          mkdir -p /usr/share/applications
          make_link() {
            name="$1"; url="$2"; file="$3"
            cat > "/usr/share/applications/$file.desktop" <<EOF
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=$name
          Comment=$name web app
          Exec=xdg-open $url
          Icon=web-browser
          Terminal=false
          Categories=Network;WebBrowser;
          EOF
          }
          make_link "YouTube" "https://www.youtube.com/" "dub-youtube"
          make_link "TikTok" "https://www.tiktok.com/" "dub-tiktok"
          make_link "WhatsApp" "https://web.whatsapp.com/" "dub-whatsapp"
          make_link "Facebook" "https://www.facebook.com/" "dub-facebook"
          make_link "Messenger" "https://www.messenger.com/" "dub-messenger"
          make_link "Google Play Store (Web)" "https://play.google.com/store" "dub-play-store-web"
          HOOK
          chmod +x "$BUILD_DIR/config/hooks/live/0100-install-edge-and-app-launchers.hook.chroot"
          cat > "$BUILD_DIR/config/includes.chroot/usr/share/applications/dub-edge.desktop" <<'DESKTOP'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Microsoft Edge
          Comment=Microsoft Edge browser
          Exec=microsoft-edge-stable %U
          Icon=microsoft-edge
          Terminal=false
          Categories=Network;WebBrowser;
          DESKTOP
          cat > "$BUILD_DIR/config/includes.chroot/usr/share/applications/dub-chrome.desktop" <<'DESKTOP'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Google Chrome
          Comment=Google Chrome browser
          Exec=google-chrome-stable %U
          Icon=google-chrome
          Terminal=false
          Categories=Network;WebBrowser;
          DESKTOP
          echo "Added Edge install hook and web launchers for YouTube, TikTok, WhatsApp, Facebook, Messenger and Play Store website."
          echo "Play Store is a web shortcut only; native Android Play Store support is not claimed."
          echo "Chrome remains supplied by the build kit's existing Chrome installer."

      - name: Fix live-build auto config recursion
        run: |
          set -eux
          AUTO_CONFIG="$BUILD_DIR/auto/config"
          if [ -f "$AUTO_CONFIG" ]; then
            echo "Original auto/config:"
            sed -n '1,180p' "$AUTO_CONFIG"
            # Debian live-build's auto/config must call "lb config noauto"
            # so that lb does not recursively execute auto/config forever.
            sed -i -E 's/^([[:space:]]*)lb[[:space:]]+config([[:space:]]|$)/\1lb config noauto\2/' "$AUTO_CONFIG"
            chmod +x "$AUTO_CONFIG"
            # neofetch is no longer available in Debian Trixie; remove it from
            # any live-build package list so the image can continue building.
            find "$BUILD_DIR" -type f ! -name '*.zip' -exec sed -i -E 's/(^|[[:space:]])neofetch([[:space:]]|$)/ /g' {} +
            if grep -Rni --exclude='*.zip' neofetch "$BUILD_DIR"; then
              echo "neofetch reference remains in build files"
              exit 1
            fi
            echo "Patched auto/config:"
            sed -n '1,180p' "$AUTO_CONFIG"
            if grep -Eq '^[[:space:]]*lb[[:space:]]+config[[:space:]]*$' "$AUTO_CONFIG"; then
              echo "Unpatched recursive lb config command remains"
              exit 1
            fi
          else
            echo "No auto/config file found at expected path"
            find "$BUILD_DIR" -path '*/auto/config' -type f -print
          fi

      - name: Build ISO
        run: |
          set -eux
          cd "$BUILD_DIR"
          chmod +x BUILD-LINUX.sh
          ./BUILD-LINUX.sh

      - name: Verify ISO contents and identify operating system
        shell: bash
        run: |
          set -euxo pipefail
          ISO=$(find "$BUILD_DIR" -type f -iname '*.iso' | head -n 1)
          test -n "$ISO"
          mkdir -p validation
          {
            echo "DUB LEDGER 12.1 ISO validation"
            echo "ISO file: $ISO"
            echo "File size: $(stat -c '%s bytes' "$ISO")"
            echo
            echo "ISO volume information:"
            xorriso -indev "$ISO" -pvd_info 2>&1 || true
            echo
            echo "ISO file listing (first 100 entries):"
            xorriso -indev "$ISO" -find / -type f -exec lsdl 2>&1 | head -100 || true
          } > validation/iso-validation.txt
          mkdir -p validation/rootfs
          if xorriso -osirrox on -indev "$ISO" -extract /live/filesystem.squashfs validation/filesystem.squashfs >/dev/null 2>&1; then
            unsquashfs -cat validation/filesystem.squashfs etc/os-release > validation/os-release.txt
            cat validation/os-release.txt >> validation/iso-validation.txt
            cp validation/os-release.txt validation/rootfs-os-release.txt
          else
            echo "Could not locate /live/filesystem.squashfs; OS identity was not verified." | tee -a validation/iso-validation.txt
            exit 1
          fi
          echo "ISO content inspection completed. Review os-release before calling this a Windows installer."

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: DUB-LEDGER-12.1-ISO
          path: |
            **/*.iso
            validation/iso-validation.txt
            validation/os-release.txt
          if-no-files-found: error
          retention-days: 14
