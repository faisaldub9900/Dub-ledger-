name: Build DUB LEDGER WINDOWS ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            unzip xorriso squashfs-tools \
            debootstrap live-build \
            grub-pc-bin grub-efi-amd64-bin \
            mtools dosfstools isolinux \
            syslinux-common rsync wget curl git

      - name: Extract DUB LEDGER Build Kit
        run: |
          set -eux
          mkdir -p buildkit
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          test -n "$ZIP"
          unzip -q "$ZIP" -d buildkit
          SCRIPT=$(find buildkit -name BUILD-LINUX.sh | head -n 1)
          test -n "$SCRIPT"
          BUILD_DIR=$(dirname "$SCRIPT")
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          echo "Build script: $SCRIPT"
          find "$BUILD_DIR" -maxdepth 2 -type f | sort | head -200

      - name: Fix live-build auto config recursion
        run: |
          set -eux
          AUTO_CONFIG="$BUILD_DIR/auto/config"
          if [ -f "$AUTO_CONFIG" ]; then
            echo "Original auto/config:"
            sed -n '1,180p' "$AUTO_CONFIG"
            # Debian live-build's auto/config must call "lb config noauto"
            # so that lb does not recursively execute auto/config forever.
            sed -i -E 's/^([[:space:]]*)lb[[:space:]]+config([[:space:]]|$)/\1lb config noauto\2/' "$AUTO_CONFIG"
            chmod +x "$AUTO_CONFIG"
            echo "Patched auto/config:"
            sed -n '1,180p' "$AUTO_CONFIG"
            if grep -Eq '^[[:space:]]*lb[[:space:]]+config[[:space:]]*$' "$AUTO_CONFIG"; then
              echo "Unpatched recursive lb config command remains"
              exit 1
            fi
          else
            echo "No auto/config file found at expected path"
            find "$BUILD_DIR" -path '*/auto/config' -type f -print
          fi

      - name: Build ISO
        run: |
          set -eux
          cd "$BUILD_DIR"
          chmod +x BUILD-LINUX.sh
          sudo ./BUILD-LINUX.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: DUB-LEDGER-WINDOWS-1.0-ISO
          path: |
            **/*.iso
          if-no-files-found: error
          retention-days: 14
